# Generated by `npm run openapi:generate --prefix api` from Zod schemas. Do not hand-edit.
openapi: 3.0.3
info:
  title: FelOps Backend Client API
  version: 1.0.0
  description: Client-facing REST API for FelOps. Covers implemented Health, Authentication, and
    Workspace onboarding endpoints.
servers:
  - url: http://localhost:3000/api/v1
    description: Local
  - url: https://felops-backend.onrender.com/api/v1
    description: Production
tags:
  - name: Health
    description: Service liveness check
  - name: Auth
    description: Account registration, verification, sessions, and password reset
  - name: Workspaces
    description: Owner-scoped workspace onboarding and selection
paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: Service is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                required:
                  - status
              example:
                status: ok
  /auth/sign-up:
    post:
      tags:
        - Auth
      summary: Create account
      description: Creates an unverified account, or resends a code for an existing unverified account
        without changing its credentials, and sends a 6-digit verification code. Returns 409
        EMAIL_ALREADY_EXISTS when a verified account already exists.
      operationId: signUp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpRequest"
            example:
              name: Hana Ehab
              email: hana@acm.com
              password: StrongPassword123!
      responses:
        "202":
          description: Accepted (empty body)
        "400": &a1
          $ref: "#/components/responses/MalformedRequest"
        "409":
          description: A verified account with this email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: EMAIL_ALREADY_EXISTS
        "413": &a2
          $ref: "#/components/responses/PayloadTooLarge"
        "422": &a4
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500": &a3
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
  /auth/verify-email:
    post:
      tags:
        - Auth
      summary: Verify email with 6-digit code
      description: Verifies the 6-digit code (hash checked before expiry; max 5 attempts; 10-minute TTL;
        single-use), marks the user verified, issues an access token, and sets the HttpOnly refresh
        cookie.
      operationId: verifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
            example:
              email: hana@acm.com
              code: "123456"
      responses:
        "200":
          description: Email verified and session created
          headers:
            Set-Cookie:
              description: HttpOnly; SameSite=None; Secure (Lax for local HTTP); Path=/api/v1/auth refresh cookie
                (felops_refresh_token)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
              example:
                data:
                  accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  user:
                    id: 1
                    name: Hana Ehab
                    email: hana@acm.com
                    isVerified: true
                    createdAt: 2026-11-26T12:00:00.000Z
                    updatedAt: 2026-11-26T12:01:00.000Z
        "400": *a1
        "413": *a2
        "422":
          description: Validation, invalid/exhausted code, or expired code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                validationError: &a5
                  summary: Schema or field validation failure
                  value:
                    error:
                      code: VALIDATION_ERROR
                      details:
                        - field: email
                          code: invalid_format
                invalidCode:
                  summary: Wrong, consumed, unknown, or exhausted (5 attempts) code
                  value:
                    error:
                      code: INVALID_VERIFICATION_CODE
                expiredCode:
                  summary: Matching code has expired (10-minute TTL)
                  value:
                    error:
                      code: VERIFICATION_CODE_EXPIRED
        "429":
          $ref: "#/components/responses/RateLimited"
        "500": *a3
  /auth/resend-verification:
    post:
      tags:
        - Auth
      summary: Resend email verification code
      description: Rate-limited per client IP. Returns 202 when a new code is sent, 404 NOT_FOUND for
        unknown emails, or 409 EMAIL_ALREADY_VERIFIED if already verified.
      operationId: resendVerification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendVerificationRequest"
            example:
              email: hana@acm.com
      responses:
        "202":
          description: Accepted (empty body)
        "400": *a1
        "404":
          description: No account exists for the submitted email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: NOT_FOUND
                  details:
                    - resource: user
        "409":
          description: Account email is already verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: EMAIL_ALREADY_VERIFIED
        "413": *a2
        "422": *a4
        "429":
          $ref: "#/components/responses/RateLimited"
        "500": *a3
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
  /auth/sign-in:
    post:
      tags:
        - Auth
      summary: Sign in with email and password
      operationId: signIn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
            example:
              email: hana@acm.com
              password: StrongPassword123!
      responses:
        "200":
          description: Authenticated
          headers:
            Set-Cookie:
              description: HttpOnly; SameSite=None; Secure (Lax for local HTTP); Path=/api/v1/auth refresh cookie
                (felops_refresh_token)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "400": *a1
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: INVALID_CREDENTIALS
        "403":
          description: Account email has not been verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: EMAIL_NOT_VERIFIED
        "413": *a2
        "422": *a4
        "429":
          $ref: "#/components/responses/RateLimited"
        "500": *a3
  /auth/refresh:
    post:
      tags:
        - Auth
      summary: Rotate refresh cookie and issue a new access token
      operationId: refreshSession
      security:
        - refreshToken: []
      responses:
        "200":
          description: Session refreshed and refresh cookie rotated
          headers:
            Set-Cookie:
              description: Rotated HttpOnly refresh cookie (felops_refresh_token)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "401":
          description: Refresh cookie missing, expired, revoked, or reused outside grace window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: SESSION_EXPIRED
        "403":
          $ref: "#/components/responses/ForbiddenOrigin"
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/sign-out:
    post:
      tags:
        - Auth
      summary: Revoke current session and clear refresh cookie
      description: Idempotent; revokes the session if a valid refresh cookie is present and always clears
        the cookie.
      operationId: signOut
      security:
        - refreshToken: []
        - {}
      responses:
        "204":
          description: Signed out
        "403":
          $ref: "#/components/responses/ForbiddenOrigin"
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/me:
    get:
      tags:
        - Auth
      summary: Get authenticated user profile
      operationId: getMe
      security:
        - userAccessToken: []
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
              example:
                data:
                  id: 1
                  name: Hana Ehab
                  email: hana@acm.com
                  isVerified: true
                  createdAt: 2026-11-26T12:00:00.000Z
                  updatedAt: 2026-11-26T12:01:00.000Z
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/password-reset/request:
    post:
      tags:
        - Auth
      summary: Request password reset code
      description: Rate-limited per client IP. Sends a 6-digit reset code when the account exists, or
        returns 404 NOT_FOUND for unknown emails.
      operationId: requestPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
            example:
              email: hana@acm.com
      responses:
        "202":
          description: Accepted (empty body)
        "400": *a1
        "404":
          description: No account exists for the submitted email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: NOT_FOUND
                  details:
                    - resource: user
        "413": *a2
        "422": *a4
        "429":
          $ref: "#/components/responses/RateLimited"
        "500": *a3
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
  /auth/password-reset/verify:
    post:
      tags:
        - Auth
      summary: Verify 6-digit password reset code
      description: Validates the 6-digit reset code and returns a short-lived resetToken without consuming
        the code until confirmation succeeds.
      operationId: verifyPasswordResetCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetVerifyRequest"
            example:
              email: hana@acm.com
              code: "123456"
      responses:
        "200":
          description: Reset code verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetVerifyResponse"
              example:
                data:
                  resetToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        "400": *a1
        "413": *a2
        "422":
          description: Validation, invalid/exhausted code, or expired code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                validationError: *a5
                invalidCode:
                  summary: Wrong, consumed, unknown, or exhausted (5 attempts) code
                  value:
                    error:
                      code: INVALID_RESET_CODE
                expiredCode:
                  summary: Matching code has expired (10-minute TTL)
                  value:
                    error:
                      code: RESET_CODE_EXPIRED
        "429":
          $ref: "#/components/responses/RateLimited"
        "500": *a3
  /auth/password-reset/confirm:
    post:
      tags:
        - Auth
      summary: Set new password using verified reset token
      description: Validates password strength (>= 12 chars) first, then consumes the bound reset code,
        updates the password hash, marks the user verified, and revokes all active sessions.
      operationId: confirmPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirmRequest"
            example:
              resetToken: <signed-reset-jwt>
              newPassword: BrandNewStrongPassword123!
      responses:
        "204":
          description: Password updated and all sessions revoked
        "400": *a1
        "413": *a2
        "422":
          description: Validation failure (>= 12 char password), invalid reset token/code, or expired token/code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                validationError: *a5
                invalidCode:
                  summary: Reset token or bound code is invalid or already consumed
                  value:
                    error:
                      code: INVALID_RESET_CODE
                expiredCode:
                  summary: Reset token or bound code has expired
                  value:
                    error:
                      code: RESET_CODE_EXPIRED
        "429":
          $ref: "#/components/responses/RateLimited"
        "500": *a3
  /workspaces:
    get:
      tags:
        - Workspaces
      summary: List workspaces owned by the authenticated user
      operationId: listWorkspaces
      security:
        - userAccessToken: []
      responses:
        "200":
          description: Owned workspaces with agent counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceListResponse"
              example:
                data:
                  - id: 1
                    name: Acme Studio
                    role: owner
                    agentsCount: 2
                    createdAt: 2026-11-26T12:00:00.000Z
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags:
        - Workspaces
      summary: Create a new workspace
      operationId: createWorkspace
      security:
        - userAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkspaceRequest"
            example:
              name: Acme Studio
      responses:
        "201":
          description: Workspace created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceResponse"
              example:
                data:
                  id: 1
                  name: Acme Studio
                  role: owner
                  agentsCount: 0
                  createdAt: 2026-11-26T12:00:00.000Z
        "400": *a1
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          description: User already owns the maximum of 10 workspaces
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: WORKSPACE_LIMIT_REACHED
        "413": *a2
        "422": *a4
        "500": *a3
  /workspaces/{workspaceId}:
    get:
      tags:
        - Workspaces
      summary: Get workspace detail
      operationId: getWorkspace
      security:
        - userAccessToken: []
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      responses:
        "200":
          description: Workspace detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    userAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived (~15m) user access token returned by sign-in, verify-email, and refresh.
    refreshToken:
      type: apiKey
      in: cookie
      name: felops_refresh_token
      description: HttpOnly, SameSite=None; Secure opaque refresh cookie scoped to /api/v1/auth.
  schemas:
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            details:
              type: array
              items:
                type: object
    ValidationDetail:
      type: object
      required:
        - field
        - code
      description: Field-level Zod validation issue emitted inside 422 VALIDATION_ERROR details.
      properties:
        field:
          type: string
          description: Dot-joined path to the invalid field (empty when root-level).
          example: email
        code:
          type: string
          enum:
            - invalid_type
            - too_small
            - too_big
            - invalid_format
            - unrecognized_keys
            - custom
          description: "Zod 4 issue code: invalid_type (missing/wrong type), too_small (below
            minLength/minimum), too_big (above maxLength/maximum), invalid_format
            (email/regex/UUID), unrecognized_keys (unknown body field), custom (schema refinement)."
          example: invalid_format
    NotFoundDetail:
      type: object
      required:
        - resource
      properties:
        resource:
          type: string
          enum:
            - user
            - workspace
            - integration
            - connection
            - action
            - agent
            - knowledge_source
            - channel
            - execution
            - approval
            - conversation
          example: workspace
    UpstreamDetail:
      type: object
      required:
        - service
      properties:
        service:
          type: string
          enum:
            - storage
            - ai_service
            - email
    Meta:
      type: object
      required:
        - page
        - limit
        - total
        - totalPages
      properties:
        page:
          type: integer
          minimum: 1
          example: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
          example: 20
        total:
          type: integer
          minimum: 0
          example: 42
        totalPages:
          type: integer
          minimum: 0
          example: 3
    User:
      type: object
      required:
        - id
        - name
        - email
        - isVerified
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Hana Ehab
        email:
          type: string
          format: email
          example: hana@acm.com
        isVerified:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    UserResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/User"
    AuthSessionResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - accessToken
            - user
          properties:
            accessToken:
              type: string
            user:
              $ref: "#/components/schemas/User"
    PasswordResetVerifyResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - resetToken
          properties:
            resetToken:
              type: string
    Workspace:
      type: object
      required:
        - id
        - name
        - role
        - agentsCount
        - createdAt
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Acme Studio
        role:
          type: string
          enum:
            - owner
        agentsCount:
          type: integer
          example: 2
        createdAt:
          type: string
          format: date-time
    WorkspaceResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/Workspace"
    WorkspaceListResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Workspace"
    SignUpRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        email:
          type: string
          format: email
          pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
        password:
          type: string
          minLength: 12
          maxLength: 128
      required:
        - name
        - email
        - password
      additionalProperties: false
    VerifyEmailRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
        code:
          type: string
          pattern: ^\d{6}$
      required:
        - email
        - code
      additionalProperties: false
    ResendVerificationRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
      required:
        - email
      additionalProperties: false
    SignInRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
        password:
          type: string
          minLength: 1
          maxLength: 128
      required:
        - email
        - password
      additionalProperties: false
    PasswordResetRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
      required:
        - email
      additionalProperties: false
    PasswordResetVerifyRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
        code:
          type: string
          pattern: ^\d{6}$
      required:
        - email
        - code
      additionalProperties: false
    PasswordResetConfirmRequest:
      type: object
      properties:
        resetToken:
          type: string
          minLength: 1
        newPassword:
          type: string
          minLength: 12
          maxLength: 128
      required:
        - resetToken
        - newPassword
      additionalProperties: false
    CreateWorkspaceRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
      required:
        - name
      additionalProperties: false
  responses:
    MalformedRequest:
      description: Malformed JSON body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: MALFORMED_REQUEST
    Unauthenticated:
      description: Missing, invalid, or expired access token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: UNAUTHENTICATED
    NotFound:
      description: Resource not found or caller lacks access
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: NOT_FOUND
              details:
                - resource: workspace
    PayloadTooLarge:
      description: Request body exceeds 100kb limit
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: PAYLOAD_TOO_LARGE
    ValidationError:
      description: Semantic or schema validation failure (also used for auth-specific 422 codes)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: VALIDATION_ERROR
              details:
                - field: email
                  code: invalid_format
    RateLimited:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: RATE_LIMITED
    ForbiddenOrigin:
      description: Cookie-authenticated request came from a disallowed Origin
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: FORBIDDEN
    UpstreamUnavailable:
      description: Email delivery is unavailable; the request can be retried
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: UPSTREAM_UNAVAILABLE
              details:
                - service: email
    InternalError:
