BadRequest:
  description: Invalid request.
  content:
    application/json:
      schema:
        $ref: '../schemas/common.yaml#/ErrorEnvelope'
      example:
        error:
          code: VALIDATION_ERROR
          details:
            - field: email
              code: INVALID_FORMAT
            - field: password
              code: TOO_SHORT
              params:
                minLength: 8

NotFound:
  description: Resource not found.
  content:
    application/json:
      schema:
        $ref: '../schemas/common.yaml#/ErrorEnvelope'
      example:
        error:
          code: EVENT_NOT_FOUND

InternalServerError:
  description: Unexpected server error.
  content:
    application/json:
      schema:
        $ref: '../schemas/common.yaml#/ErrorEnvelope'
      example:
        error:
          code: INTERNAL_ERROR
