integrations:
  get:
    tags:
      - Integrations
    summary: List workspace integrations
    responses:
      '200':
        description: Available integrations and their connection status.
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '../components/schemas/common.yaml#/Integration'
      '500':
        $ref: '../components/responses/common.yaml#/InternalServerError'

integration:
  parameters:
    - $ref: '#/integrationId'
  get:
    tags:
      - Integrations
    summary: Get integration details
    responses:
      '200':
        description: Integration details and available actions.
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: object
                      required:
                        - integration
                        - actions
                      properties:
                        integration:
                          $ref: '../components/schemas/common.yaml#/Integration'
                        actions:
                          type: array
                          items:
                            $ref: '../components/schemas/common.yaml#/Action'
      '404':
        $ref: '../components/responses/common.yaml#/NotFound'

authorize:
  parameters:
    - $ref: '#/integrationId'
  get:
    tags:
      - Integrations
    summary: Start OAuth authorization
    description: Returns an authorization URL and state value for OAuth integrations.
    responses:
      '200':
        description: OAuth authorization information.
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '../components/schemas/common.yaml#/OAuthAuthorization'
      '400':
        $ref: '../components/responses/common.yaml#/BadRequest'
      '404':
        $ref: '../components/responses/common.yaml#/NotFound'

callback:
  parameters:
    - $ref: '#/integrationId'
    - name: code
      in: query
      required: true
      schema:
        type: string
    - name: state
      in: query
      required: true
      schema:
        type: string
  get:
    tags:
      - Integrations
    summary: Complete OAuth authorization
    responses:
      '302':
        description: Redirect to the frontend with the authorization result.
        headers:
          Location:
            schema:
              type: string
              format: uri
      '400':
        $ref: '../components/responses/common.yaml#/BadRequest'
      '404':
        $ref: '../components/responses/common.yaml#/NotFound'

credentials:
  parameters:
    - $ref: '#/integrationId'
  post:
    tags:
      - Integrations
    summary: Connect an API-key integration
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/common.yaml#/ApiKeyCredentials'
    responses:
      '200':
        description: Integration connected.
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '../components/schemas/common.yaml#/Integration'
      '400':
        $ref: '../components/responses/common.yaml#/BadRequest'
      '404':
        $ref: '../components/responses/common.yaml#/NotFound'
  delete:
    tags:
      - Integrations
    summary: Disconnect an integration
    responses:
      '204':
        description: Integration disconnected.
      '404':
        $ref: '../components/responses/common.yaml#/NotFound'

integrationId:
  name: integrationId
  in: path
  required: true
  description: Integration identifier.
  schema:
    type: string
