actions:
  get:
    tags:
      - Actions
    summary: List workspace actions
    parameters:
      - $ref: '#/integrationFilter'
      - $ref: '#/search'
    responses:
      '200':
        description: Actions grouped by integration.
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: object
                      additionalProperties:
                        type: array
                        items:
                          $ref: '../components/schemas/common.yaml#/Action'

agentActions:
  parameters:
    - $ref: '#/agentId'
  get:
    tags:
      - Actions
    summary: List actions allowed for an agent
    parameters:
      - $ref: '#/integrationFilter'
      - $ref: '#/search'
    responses:
      '200':
        description: Agent actions grouped by integration.
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: object
                      additionalProperties:
                        type: array
                        items:
                          $ref: '../components/schemas/common.yaml#/AgentAction'
      '404':
        $ref: '../components/responses/common.yaml#/NotFound'

agentAction:
  parameters:
    - $ref: '#/agentId'
    - $ref: '#/actionId'
  put:
    tags:
      - Actions
    summary: Configure an action for an agent
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/common.yaml#/ActionConfiguration'
    responses:
      '200':
        description: Action configuration updated.
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '../components/schemas/common.yaml#/AgentAction'
      '400':
        $ref: '../components/responses/common.yaml#/BadRequest'
      '404':
        $ref: '../components/responses/common.yaml#/NotFound'

executions:
  get:
    tags:
      - Executions
    summary: List workspace execution history
    parameters:
      - $ref: '#/page'
      - $ref: '#/limit'
    responses:
      '200':
        description: Executed actions across all workspace agents.
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '../components/schemas/common.yaml#/Execution'

agentExecutions:
  parameters:
    - $ref: '#/agentId'
  get:
    tags:
      - Executions
    summary: List execution history for an agent
    parameters:
      - $ref: '#/page'
      - $ref: '#/limit'
    responses:
      '200':
        description: Executed actions for the selected agent.
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '../components/schemas/common.yaml#/Execution'
      '404':
        $ref: '../components/responses/common.yaml#/NotFound'

agentId:
  name: agentId
  in: path
  required: true
  description: Agent identifier.
  schema:
    type: string

actionId:
  name: actionId
  in: path
  required: true
  description: Action identifier.
  schema:
    type: string

integrationFilter:
  name: integrationId
  in: query
  required: false
  schema:
    type: string

search:
  name: search
  in: query
  required: false
  schema:
    type: string

page:
  name: page
  in: query
  required: false
  schema:
    type: integer
    minimum: 1
    default: 1

limit:
  name: limit
  in: query
  required: false
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 20
