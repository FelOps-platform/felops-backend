openapi: '3.0.3'

info:
  title: Felops API
  version: '1.0'
  description: API for managing workspace integrations, actions, and execution history.

servers:
  - url: https://felops-backend.onrender.com/api/v1

security:
  - bearerAuth: []

tags:
  - name: Health
  - name: Integrations
  - name: Actions
  - name: Executions

paths:
  /health:
    get:
      tags:
        - Health
      summary: Check service health
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: './components/schemas/common.yaml#/HealthResponse'
  /integrations:
    $ref: './paths/integrations.yaml#/integrations'
  /integrations/{integrationId}:
    $ref: './paths/integrations.yaml#/integration'
  /integrations/{integrationId}/authorize:
    $ref: './paths/integrations.yaml#/authorize'
  /integrations/{integrationId}/callback:
    $ref: './paths/integrations.yaml#/callback'
  /integrations/{integrationId}/credentials:
    $ref: './paths/integrations.yaml#/credentials'
  /actions:
    $ref: './paths/actions.yaml#/actions'
  /agents/{agentId}/actions:
    $ref: './paths/actions.yaml#/agentActions'
  /agents/{agentId}/actions/{actionId}:
    $ref: './paths/actions.yaml#/agentAction'
  /executions:
    $ref: './paths/actions.yaml#/executions'
  /agents/{agentId}/executions:
    $ref: './paths/actions.yaml#/agentExecutions'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
