name: Agent workflow

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  workflow-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check agent workflow
        run: bash bin/check-agent-workflow.sh
