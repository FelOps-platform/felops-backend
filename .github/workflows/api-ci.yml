name: API checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install
        run: npm ci --prefix api --ignore-scripts
      - name: Lint
        run: npm run lint --prefix api
      - name: Typecheck
        run: npm run typecheck --prefix api
      - name: Test
        run: npm test --prefix api
      - name: Build
        run: npm run build --prefix api
      - name: Format check
        run: npm run format:check --prefix api
      - name: OpenAPI check
        run: npm run openapi:check --prefix api
