name: OpenCode config

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  opencode-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check OpenCode config
        run: bash bin/check-opencode-config.sh
